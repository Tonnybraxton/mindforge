name: MindForge checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start PostgreSQL, migrations, API and web
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify the same-origin deployment
        run: |
          curl --fail http://localhost:8080/ >/dev/null
          curl --fail http://localhost:8080/games >/dev/null
          curl --fail http://localhost:8080/manifest.webmanifest >/dev/null
          curl --fail http://localhost:8080/icon-192.png >/dev/null
          curl --fail http://localhost:8080/api/health
      - name: Container diagnostics
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
